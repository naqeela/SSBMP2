<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tabletop Spatial Audio — Color Tracking</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font-family: sans-serif; text-align: center; }
  canvas { display: block; margin: 20px auto; }
</style>
</head>
<body>
  <h3>Tabletop Spatial Audio Engine</h3>
  <p>Point an overhead camera at the table. Click the canvas once to start the audio engine.</p>

  <!-- p5.js 1.9.4 + its bundled p5.sound addon. Do NOT swap in p5 2.x — it dropped p5.sound. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>

  <!-- Loaded per spec, for future extension. This sketch's own color tracking (plain HSV
       pixel thresholding) and synthesis (one p5.Oscillator per swatch) don't call into
       these two directly — see the note at the top of sketch.js for why. -->
  <script src="https://cdn.jsdelivr.net/npm/ml5@1/dist/ml5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>

  <script src="sketch.js"></script>
</body>
</html>
